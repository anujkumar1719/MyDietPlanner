<div class="login-container">
 
  <div class="login-card">
 
    <h2>Login</h2>
 
    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
 
      <label>Email<span>*</span></label>
      <input
          type="email"
          name="email"
          required
          email
          pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$"
          [(ngModel)]="loginData.Email"
          #email="ngModel"
          placeholder="example@domain.com">

      <div class="error" *ngIf="email.errors?.['required'] && email.touched">
          *Email is required
      </div>

      <div class="error"
          *ngIf="(email.errors?.['email'] || email.errors?.['pattern']) && email.touched">
          *Please enter a valid email address
      </div>
 
      <label>Password<span>*</span></label>
      <input
        type="password"
        name="password"
        required
        [(ngModel)]="loginData.Password"
        #password="ngModel"
        placeholder="Enter your password"
      >
 
      <div class="error" *ngIf="password.invalid && password.touched">
        *Password is required
      </div>
 
      <div class="error" *ngIf="loginForm.submitted && loginForm.invalid">
        *All fields are required
      </div>
 
      <div class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
 
      <button type="submit">Login</button>
 
      <p>
        New User?
        <a routerLink="/register">Register</a>
      </p>
    </form>
  </div>
</div>
